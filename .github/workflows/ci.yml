name: CI Quality Gate

# Principle: Every PR and every push to master passes through the same gate.
# A broken commit that slips through to master costs 10× more to fix than
# one caught here. The gate is: TypeScript → ESLint → Tests. All three must
# pass; any single failure blocks the merge button.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Mobile App (React Native / Expo) ────────────────────────────────────────
  mobile:
    name: Mobile — Typecheck · Lint · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Step 1: TypeScript
      # tsc --noEmit checks types across the entire codebase in one pass.
      # This catches: missing props, wrong return types, broken imports.
      # It does NOT emit .js files — just validates.
      - name: TypeScript type check
        run: npx tsc --noEmit

      # Step 2: ESLint
      # --max-warnings 113 is a ratchet, not a target: it's the exact count of
      # pre-existing warnings (mostly `any` types and useEffect deps) found
      # when this gate first went live. All errors are already fixed and stay
      # at zero. This threshold can only go down as the backlog is paid off --
      # bump it back up only if you've confirmed a specific new warning is
      # unavoidable, not to silence the gate.
      - name: ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 113

      # Step 3: Unit tests
      # --ci disables interactive watch mode and fails on any unexpected snapshot change.
      # --coverage generates a coverage report (visible in PR summaries with upload-artifact).
      # --passWithNoTests keeps the gate green during the initial test bootstrap phase.
      - name: Unit tests
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: coverage/
          retention-days: 7

  # ── Web Dashboard (Next.js) ──────────────────────────────────────────────────
  webapp:
    name: Webapp — Typecheck · Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        working-directory: ./webapp
        run: npm ci

      - name: Webapp TypeScript type check
        working-directory: ./webapp
        run: npx tsc --noEmit

      - name: Webapp ESLint
        working-directory: ./webapp
        run: npm run lint -- --max-warnings 0
        # Next.js projects export `next lint` via the lint script.
        # The -- passes --max-warnings 0 through to the underlying eslint call.
        continue-on-error: false

  # ── Engine (Python / FastAPI) ────────────────────────────────────────────────
  # Runs the offline subset of the pytest suite: pure calculation, parsing, and
  # scoring logic that needs zero secrets and zero live services. This is the
  # gate that would have caught the redis_url NameError incident before it
  # ever reached Railway -- a broken config.py fails collection/import here,
  # not at container startup.
  #
  # Two files are deliberately excluded, not forgotten:
  #   test_rls_isolation.py            -- requires a live Supabase project plus
  #                                        real RLS_TEST_USER_A/B credentials;
  #                                        module-level `os.environ[...]` means
  #                                        it hard-fails collection without them.
  #   test_tenant_isolation.py         -- TestTenantIsolation / TestApiVersioning
  #     (TestTenantIsolation,             classes hit a live engine over HTTP
  #      TestApiVersioning classes)       (ENGINE_URL, defaults localhost:8000).
  #                                        TestLedgerIntegrity in the same file
  #                                        is pure and stays in the run.
  # Wiring either of those into CI means deciding on a dedicated test Supabase
  # project and a way to boot the engine in the runner first -- deliberately
  # left for a follow-up, not silently skipped.
  engine:
    name: Engine — Pytest (offline subset)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/engine/requirements.txt

      - name: Install dependencies
        working-directory: ./services/engine
        run: |
          pip install -r requirements.txt
          pip install pytest==9.0.3

      - name: Run offline test suite
        working-directory: ./services/engine
        run: |
          pytest tests/ -q --no-header \
            --deselect tests/test_tenant_isolation.py::TestTenantIsolation \
            --deselect tests/test_tenant_isolation.py::TestApiVersioning \
            --ignore=tests/test_rls_isolation.py

  # ── Edge Functions (Deno) ────────────────────────────────────────────────────
  # Note: Deno edge functions use a separate toolchain (deno check, deno lint).
  # This job runs only if the Deno CLI is available. It is NOT blocking for now
  # (continue-on-error: true) since it requires SUPABASE env vars for full validation.
  # Remove continue-on-error once Deno secrets are configured in GitHub Actions.
  deno:
    name: Edge Functions — Deno type check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check edge functions
        run: |
          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            entry="$fn_dir/index.ts"
            if [ -f "$entry" ]; then
              echo "Checking $fn_name..."
              deno check --no-lock "$entry" || echo "  ⚠ $fn_name has type errors"
            fi
          done
